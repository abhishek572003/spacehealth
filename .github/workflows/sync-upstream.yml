name: Sync from upstream
# Pulls adhikarinarayan/spacehealth main into this fork so Vercel redeploys.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository != 'adhikarinarayan/spacehealth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/adhikarinarayan/spacehealth.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."; exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Upstream changes conflict with this fork. Merge upstream/main by hand."
            exit 1
          fi
          git push origin HEAD:main
